name: Reportar un error
description: Algo no funciona al respaldar, instalar o restaurar.
title: "[Error] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **No pegues** claves del instalador, contraseñas, volcados de base de datos ni enlaces de restauración.
        Si es un problema de seguridad, no abras un issue: sigue [SECURITY.md](https://github.com/kombicl/kombi-backup/blob/main/SECURITY.md).
  - type: dropdown
    id: where
    attributes:
      label: ¿Dónde ocurre?
      options:
        - Crear respaldo
        - Subir respaldo
        - Instalador (sitio nuevo)
        - Restaurar sobre el sitio
        - Actualización del plugin
        - Pantalla de administración
        - Otro
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
      description: Qué esperabas y qué ocurrió. Incluye el mensaje de error exacto si lo hay.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Versión de Kombi Backup
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: WordPress / PHP / base de datos
      placeholder: "WordPress 6.8, PHP 8.2, MariaDB 10.6"
    validations:
      required: true
  - type: input
    id: hosting
    attributes:
      label: Hosting / servidor web
      placeholder: "cPanel + LiteSpeed, nginx, local con Laragon…"
  - type: textarea
    id: notes
    attributes:
      label: Avisos del respaldo o del instalador
      description: El texto de "N avisos" en la lista de respaldos, o el registro que muestra el instalador.
      render: text
